name: Build APK

# Runs by itself every time app.zip is uploaded (pushed) to the repo.
# It also runs if you press "Run workflow" in the Actions tab.
on:
  push:
    paths:
      - 'app.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Finds the project: inside app.zip (normal case) or directly in the repo.
      - name: Unzip app.zip and locate the project
        id: loc
        run: |
          if [ -f app.zip ]; then
            rm -rf _src && mkdir -p _src
            unzip -q app.zip -d _src
            F=$(find _src -name settings.gradle.kts -not -path '*/node_modules/*' | head -n1)
          else
            F=$(find . -maxdepth 3 -name settings.gradle.kts | head -n1)
          fi
          if [ -z "$F" ]; then
            echo "settings.gradle.kts not found. Upload the complete app.zip to the repo root."
            exit 1
          fi
          D=$(dirname "$F")
          echo "Project folder: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Copy APK
        run: |
          mkdir -p out
          cp "${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" out/IslamicStudiesAcademy-debug.apk
          ls -l out

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: IslamicStudiesAcademy-APK
          path: out/IslamicStudiesAcademy-debug.apk

      # A normal download link on the Releases page (easy to open on a phone).
      - name: Publish APK in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" out/IslamicStudiesAcademy-debug.apk \
            --title "APK build ${{ github.run_number }}" \
            --notes "Built automatically from app.zip (commit ${GITHUB_SHA::7})." || echo "Release step skipped (check Settings > Actions > Workflow permissions: Read and write)."

      # The unit tests check the lesson / question / glossary files. They never block the APK.
      - name: Run content tests
        continue-on-error: true
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle testDebugUnitTest --no-daemon --continue 2>&1 | tee test-log.txt

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: ${{ steps.loc.outputs.dir }}/test-log.txt
          if-no-files-found: ignore
